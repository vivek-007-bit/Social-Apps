<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant social photography gradient -->
    <linearGradient id="instaV2Gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD55" />
      <stop offset="25%" stop-color="#FF543E" />
      <stop offset="50%" stop-color="#DE1D80" />
      <stop offset="75%" stop-color="#B22AC9" />
      <stop offset="100%" stop-color="#4E60D3" />
    </linearGradient>
    <!-- Soft shadow for small-scale crispness -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#instaV2Gradient)" />

  <!-- Outer camera frame -->
  <rect x="96" y="96" width="320" height="320" rx="76" ry="76" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center camera lens -->
  <circle cx="256" cy="256" r="76" fill="none" stroke="#FFFFFF" stroke-width="36" />

  <!-- Viewfinder / flash element -->
  <circle cx="344" cy="168" r="22" fill="#FFFFFF" />
</svg>
