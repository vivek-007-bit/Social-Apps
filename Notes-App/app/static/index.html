<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f5f1e8">

    <meta name="description" content="A simple personal notes application.">

    <link rel="manifest" href="/static/manifest.json">

    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">

    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <link rel="stylesheet" href="/static/style.css">

    <title>Notes</title>
</head>

<body>
    <div class="app-shell">

        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="brand">
                    <div class="brand-icon">
                        N
                    </div>

                    <div>
                        <h1>Notes</h1>
                        <p>Personal notes</p>
                    </div>
                </div>

                <button id="new-note-button" class="primary-button new-note-button" type="button">
                    + New Note
                </button>

            </div>

            <div class="search-wrapper">
                <label class="sr-only" for="search-input">
                    Search notes
                </label>

                <input id="search-input" class="search-input" type="search" placeholder="Search notes..."
                    autocomplete="off">
            </div>

            <div id="notes-list" class="notes-list"></div>

            <div class="sidebar-footer">
                <span id="note-count">0 notes</span>
            </div>

        </aside>

        <main class="main-content">

            <header class="editor-header">

                <button id="mobile-back-button" class="mobile-back-button" type="button" aria-label="Back to notes">
                    ← Notes
                </button>

                <div id="editor-status" class="editor-status">
                    No note selected
                </div>

                <div class="editor-actions">

                    <button id="edit-note-button" class="secondary-button" type="button" disabled>
                        Edit
                    </button>

                    <button id="save-note-button" class="primary-button" type="button" disabled>
                        Save
                    </button>

                    <button id="cancel-edit-button" class="secondary-button" type="button" disabled>
                        Cancel
                    </button>

                    <div class="export-wrapper">

                        <button id="export-note-button" class="secondary-button" type="button" disabled
                            aria-haspopup="true" aria-expanded="false">
                            Export
                        </button>

                        <div id="export-menu" class="export-menu">
                            <button id="export-txt-button" type="button">
                                Export as TXT
                            </button>

                            <button id="export-image-button" type="button">
                                Export as Image
                            </button>
                        </div>

                    </div>

                    <button id="delete-note-button" class="delete-button" type="button" disabled>
                        Delete
                    </button>

                </div>

            </header>

            <section id="editor-empty" class="editor-empty">
                <div class="empty-icon">
                    +
                </div>

                <h2>Select a note</h2>

                <p>
                    Select an existing note from the list
                    or create a new one to get started.
                </p>

                <button id="empty-new-note-button" class="primary-button" type="button">
                    Create New Note
                </button>
            </section>

            <section id="note-editor" class="note-editor hidden">
                <input id="note-title" class="note-title" type="text" placeholder="Untitled Note" readonly
                    autocomplete="off">

                <div id="note-meta" class="note-meta">
                    Last updated
                </div>

                <textarea id="note-content" class="note-content" placeholder="Start writing..." readonly></textarea>
            </section>

        </main>

    </div>

    <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toast-message"></span>
    </div>

    <script src="/static/app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register(
                    "/static/sw.js"
                ).catch((error) => {
                    console.error(
                        "Service worker registration failed:",
                        error
                    );
                });
            });
        }
    </script>
</body>

</html>
